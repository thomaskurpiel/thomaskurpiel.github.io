<!doctype html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Kurzprofil von Thomas Kurpiel – Elektrotechnik und Prüftechnik." />
  <title>Thomas Kurpiel | Kurzprofil</title>
  <link rel="stylesheet" href="cv.css" />
</head>
<body>
  <div class="toolbar no-print">
    <a href="index.html">← Zur Webseite</a>
    <button type="button" id="print-button">Als PDF speichern</button>
  </div>

  <main class="cv-page">
    <header class="cv-header">
      <div>
        <p class="kicker">Kurzprofil</p>
        <h1 id="cv-name"></h1>
        <p class="role" id="cv-title"></p>
      </div>
      <div class="cv-portrait">
        <img id="cv-profile-photo" alt="Thomas Kurpiel" />
        <div id="cv-photo-fallback" class="monogram" aria-hidden="true">TK</div>
      </div>
    </header>

    <section class="summary-block">
      <p id="cv-summary"></p>
      <div class="facts">
        <span>25+ Jahre Erfahrung</span>
        <span>Elektriker / Elektroniker</span>
        <span>Prüftechnik seit 2021</span>
      </div>
    </section>

    <div class="cv-columns">
      <div class="main-column">
        <section>
          <h2>Aktuelle Tätigkeit</h2>
          <article id="featured-project" class="featured-project"></article>
        </section>

        <section>
          <h2>Beruflicher Werdegang</h2>
          <div id="cv-projects" class="cv-projects"></div>
        </section>
      </div>

      <aside class="side-column">
        <section>
          <h2>Schwerpunkte</h2>
          <div id="cv-focus" class="chips"></div>
        </section>

        <section>
          <h2>Fachkompetenzen</h2>
          <div id="cv-technologies" class="chips compact"></div>
        </section>

        <section>
          <h2>Ausbildung</h2>
          <strong id="cv-degree"></strong>
          <p class="small" id="cv-thesis"></p>
        </section>

        <section>
          <h2>Sprachkenntnisse</h2>
          <div id="cv-languages" class="small"></div>
        </section>

        <section>
          <h2>Kontakt</h2>
          <div id="cv-contacts" class="contact-list"></div>
        </section>
      </aside>
    </div>
  </main>

  <script src="profile-data.js"></script>
  <script src="cv.js"></script>
</body>
</html>
